name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lua for generated-binding regression tests
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: ./scripts/check.sh
